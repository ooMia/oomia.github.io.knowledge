name: Project issue orchestration

on:
  issues:
    types: [opened, reopened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing Issue number to synchronize
        required: true
        type: number

permissions:
  contents: write
  issues: write

concurrency:
  group: project-orchestration-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  orchestrate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.state == 'open' && !startsWith(github.event.issue.title, 'draft:'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Synchronize Project and Development branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PROJECT_OWNER: ooMia
          PROJECT_NUMBER: "11"
          DEFAULT_DEVELOPMENT_BASE: main
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: node .github/scripts/project-orchestration.mjs
